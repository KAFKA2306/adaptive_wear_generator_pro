name: CI for AdaptiveWear Generator Pro

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -p "test_strict_generation_contract.py" -v

  blender-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Blender 4.1
        run: |
          set -euo pipefail
          BLENDER_VERSION="4.1.0"
          BLENDER_URL="https://download.blender.org/release/Blender${BLENDER_VERSION%.*}/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          BLENDER_DIR="blender-${BLENDER_VERSION}-linux-x64"
          wget --quiet --show-progress "${BLENDER_URL}" -O blender.tar.xz
          tar -xf blender.tar.xz
          echo "$(pwd)/${BLENDER_DIR}" >> "$GITHUB_PATH"
          "$(pwd)/${BLENDER_DIR}/blender" --version
          BLENDER_ADDON_DIR="$HOME/.config/blender/${BLENDER_VERSION%.*}/scripts/addons"
          echo "BLENDER_ADDON_DIR=${BLENDER_ADDON_DIR}" >> "$GITHUB_ENV"
          mkdir -p "$BLENDER_ADDON_DIR"

      - name: Install addon
        run: |
          ADDON_SOURCE_DIR="${{ github.workspace }}/src/adaptive_wear_generator_pro"
          ADDON_TARGET_DIR="${{ env.BLENDER_ADDON_DIR }}/adaptive_wear_generator_pro"
          cp -R "$ADDON_SOURCE_DIR" "$ADDON_TARGET_DIR"
          test -f "$ADDON_TARGET_DIR/__init__.py"

      - name: Create test result directories
        run: mkdir -p test-results/basic-functionality test-results/mesh-integrity test-results/fbx-roundtrip

      - name: Run basic functionality test
        run: blender -b -P tests/run_basic_functionality_test.py -- --output-dir test-results/basic-functionality

      - name: Run mesh integrity test for T-Shirt
        run: blender -b -P tests/run_mesh_integrity_test.py -- --output-dir test-results/mesh-integrity --wear-type T_SHIRT

      - name: Run mesh integrity test for Pants
        run: blender -b -P tests/run_mesh_integrity_test.py -- --output-dir test-results/mesh-integrity --wear-type PANTS

      - name: Run mesh integrity test for Skirt
        run: blender -b -P tests/run_mesh_integrity_test.py -- --output-dir test-results/mesh-integrity --wear-type SKIRT

      - name: Run FBX round-trip test
        run: blender -b -P tests/run_fbx_roundtrip_test.py -- --output-dir test-results/fbx-roundtrip

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: error
          overwrite: true

  prune-merged-branches:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete branches already merged into main
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          while IFS= read -r ref; do
            branch="${ref#origin/}"
            case "$branch" in
              main|HEAD) continue ;;
            esac
            git push origin --delete "$branch"
          done < <(git for-each-ref --format='%(refname:short)' --merged=origin/main refs/remotes/origin/)
